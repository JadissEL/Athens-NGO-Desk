# Build artifacts for manual preview deploy (static bundle + server bundle)
name: Preview build

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Root — install and build static data.js
        run: npm ci && npm run build:data
      - name: Upload static-site (includes data.js)
        uses: actions/upload-artifact@v4
        with:
          name: static-site-preview
          path: static-site/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Server — install and compile
        working-directory: server
        run: npm ci && npm run build
      - name: Upload server dist + prisma
        uses: actions/upload-artifact@v4
        with:
          name: server-preview
          path: |
            server/dist
            server/prisma
            server/package.json
            server/package-lock.json
