name: Validate data & build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Validate JSON Schemas and build data.js
        run: npm run validate && npm run validate:seed && npm run validate:import -- data/ngos/imports/pending_national.example.json && npm run build:data
