name: Static site E2E (guides)

on:
  workflow_dispatch:

jobs:
  guide-wizards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:static
