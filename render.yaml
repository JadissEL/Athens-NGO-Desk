# Render Blueprint — Phase B API (`server/`)
# https://render.com/docs/blueprint-spec
#
# Postgres: use an existing Render Postgres named `greece-ngo-desk-db` in this workspace, or add a
# `databases:` block here. DATABASE_URL is injected via `fromDatabase` (no secret in git).
# After first deploy: build runs migrate + seed once if PublishedBundle is empty.
# Later deploys keep that bundle and insert organization ids that are new in data/ngos
# (seed_from_json.ts --if-empty, then upsert_missing_orgs.ts). Neither step replaces
# existing organization records.

services:
  - type: web
    name: greece-ngo-desk-api
    runtime: node
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npx prisma migrate deploy && npm run build && npx tsx scripts/seed_from_json.ts --if-empty && npm run db:upsert:orgs && npm run db:seed:hospitality && npm run db:seed:events
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greece-ngo-desk-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT automatically — do not override unless you know the platform port.
      # Set in Render dashboard (secrets) if using Clerk steward:
      # CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, CLERK_AUTHORIZED_PARTIES
      # CORS_ORIGIN — your Vercel site origin, e.g. https://greece-ngo-desk.vercel.app
